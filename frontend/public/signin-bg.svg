<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1F3A"/>
      <stop offset="45%" stop-color="#123A6B"/>
      <stop offset="100%" stop-color="#0E4D8C"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5B942" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#E8A317" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="soft" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5BA3D9" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0B1F3A" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#F5B942" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F5B942" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#3D8FD1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0B1F3A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Base -->
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#glow1)"/>
  <rect width="1920" height="1080" fill="url(#glow2)"/>

  <!-- Abstract geometric ribbons (governance / structure) -->
  <g opacity="0.55" filter="url(#blur)">
    <path d="M-100 200 Q480 80 960 320 T2020 180 L2020 420 Q1440 520 960 400 T-100 480 Z" fill="url(#gold)"/>
    <path d="M-80 700 Q600 560 1100 780 T2000 640 L2000 900 Q1200 1000 700 860 T-80 920 Z" fill="url(#soft)"/>
  </g>

  <!-- Sharp accent shapes -->
  <g opacity="0.12" fill="#FFFFFF">
    <polygon points="0,0 420,0 0,380"/>
    <polygon points="1920,1080 1500,1080 1920,700"/>
  </g>

  <!-- Floating rings / nodes (committee network motif) -->
  <g fill="none" stroke="#F5B942" stroke-width="1.5" opacity="0.35">
    <circle cx="340" cy="260" r="56"/>
    <circle cx="340" cy="260" r="88"/>
    <circle cx="1580" cy="780" r="72"/>
    <circle cx="1580" cy="780" r="110"/>
  </g>
  <g fill="#F5B942" opacity="0.5">
    <circle cx="340" cy="260" r="6"/>
    <circle cx="1580" cy="780" r="6"/>
    <circle cx="520" cy="420" r="4"/>
    <circle cx="1280" cy="300" r="4"/>
    <circle cx="900" cy="900" r="4"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="1" opacity="0.15">
    <line x1="340" y1="260" x2="520" y2="420"/>
    <line x1="520" y1="420" x2="900" y2="900"/>
    <line x1="1280" y1="300" x2="1580" y2="780"/>
    <line x1="520" y1="420" x2="1280" y2="300"/>
  </g>

  <!-- Soft vignette -->
  <rect width="1920" height="1080" fill="url(#sky)" opacity="0.15"/>
</svg>
